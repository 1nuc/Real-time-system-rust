[package]
name = "Main"
version = "0.1.0"
edition = "2024"
[dependencies]
advanced-pid = { version = "0.2.3" , default-features=false }
float_eq = "1.0.1"
pid = "4.0.0"
rand = "0.9.2"
random-string = "1.1.0"
rayon = "1.11.0"
async-lib={path="../async-lib"}
sync-lib={path="../sync-lib"}
manufacturer={path="../manufacturer"}
tokio = { version = "1.48.0", features = ["full"] }
criterion = { version = "0.8.1", features = ["async_futures", "async_smol", "async_tokio"] }

[[bench]]
name="performance_benchmark"
harness=false

[[bench]]
name="sync_performance"
harness=false

[[bench]]
name="async_performance"
harness=false

[[bench]]
name="rabbit_mq_performance"
harness=false

[[bench]]
name="cpu_load_performance"
harness=false
